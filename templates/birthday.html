<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">

<style>

@import url('https://fonts.googleapis.com/css2?family=Playwrite+GB+J:ital,wght@0,100..400;1,100..400&display=swap');

.playwrite-font {
  font-family: "Playwrite GB J", cursive;
  font-optical-sizing: auto;
  font-weight: 200;
  font-style: normal;
}

body{
    width:1080px;
    height:1080px;
    margin:0;
    position: relative;

    background:linear-gradient(
        135deg,
        #acd5f3,
        #eaf6f9
    );

    background-image: url('../static/celebration_bg.jpg');
    background-repeat: no-repeat;
    background-size: cover;
    background-position: center;

    display:flex;
    color: white;

    justify-content:center;
    align-items:center;

    font-family:fantasy;
}

.logo {
    width: 140px;
    height: 50px;
    position: absolute;
    top: 24px;
}

.logo-left {
    left: 24px;
}

.logo-right {
    right: 24px;
    height: 40px;
}

.logo-text {
    position: absolute;
    top: 30px;
    left: 50%;
    transform: translateX(-50%);
    font-size: 24px;
    color: white;
}

.card{
    text-align:center;
}

.photo{
    width:350px;
    height:350px;
    margin: 15px;

    border-radius:50%;
    object-fit:cover;

    border:8px solid;
}

.name{
    font-size:72px;
}

.message, .phrase{
    font-size:48px;
    margin: 10px;
    font-weight: 900;
}
.message {
    font-size: 60px;
}

.date {
    font-size: 32px;
    margin-top: 50px;
}

</style>

</head>

<body>

<img src="../static/rotary_logo.png" class="logo logo-left">
<div class="logo-text">Rotary Club of Chinchwad – Pune</div>
<img src="../static/create-lasting-impact.png" class="logo logo-right">

<div class="card">

<div class="message playwrite-font">
Happy {{ event_type }}
</div>

<img src="../{{ photo_url }}" class="photo">

<div class="name">
{{ name }}
</div>

<div class="phrase playwrite-font">
    {{ phrase }}
</div>

<div class="date">
    {{ date }}
</div>

</div>

</body>
</html>
